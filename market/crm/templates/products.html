<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <link rel="stylesheet" href="/static/products_page.css">
</head>
<body>
    <h1>Пользователи</h1>

    <div>
        <h2><a href="{{ url_for('dashboard_page') }}">Dashboard</a></h2>
        <ul>
            <li>Пользователи</li>
            <li>Товары</li>
            <li>Настройки</li>
        </ul>
    </div>

    <div class="users-container">
        <h1>Продукты</h1>

        <table class="users-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Количество</th>
                </tr>
            </thead>

            <tbody>
                {% for product in products %}
                <tr>
                    <td>{{ product.id }}</td>
                    <td>{{ product.name }}</td>
                    <td>{{ product.quantity }}</td>
                </tr>

                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
