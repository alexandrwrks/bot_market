<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/static/user.css">
</head>
<body>
    <h1>User Details</h1>

    <div>
        <p>ID: {{ user.telegram_id }}</p>
        <p>Name: {{ user.first_name }}</p>
        {% if user.username %}
        <p>Username: {{ user.username }}</p>
        {% endif %}
        <p>Дата регистрации: {{ user.created_at }}</p>
        <p>Количество заказов: {{ count_of_order }}</p>
        <p>Общая сумма заказов: {{ order_cost }}</p>
    </div>
</body>
